[platformio]
; Recommended: Store cache centrally in your home .platformio directory
build_cache_dir = ${sysenv.USERPROFILE}/.platformio/build_cache

[env:esp32-s3-devkitc-1-n32r16v]
lib_ldf_mode = chain
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = opi_opi
board_build.flash_mode = dout
board_build.filesystem = littlefs
board_upload.flash_size = 32MB

monitor_speed = 115200

lib_deps =
    fastled/FastLED @ 3.10.3
    bblanchon/ArduinoJson @ 7.0.0
    mathieucarbou/ESPAsyncWebServer @ 3.1.5
    mathieucarbou/AsyncTCP @ 3.2.4

build_flags =
    -DBOARD_HAS_PSRAM
    ; FastLED's RMT interrupt calls flash-resident IDF code; without this, a flash
    ; write (Wi-Fi/NVS) during show() panics with 'Cache disabled'. Makes flash
    ; operations wait until show() finishes.
    -DFASTLED_ESP32_FLASH_LOCK=1

; Wireless upload: `pio run -e ota -t upload`. The board must be on Wi-Fi and already running
; firmware that contains the OTA code (flash that once over USB with the default env).
; NOTE: upload_port is an IP so that uploading does not depend on name lookup (the board is also
; reachable as visualizer-esp-32.local). The router must keep handing the board the same IP, so
; reserve it there: see README.md > Setup. If wireless upload fails with "Host ... Not Found" or a
; timeout, read the board's current IP from the serial monitor ("ESP32 IP: ...") and update
; upload_port below.
[env:ota]
extends = env:esp32-s3-devkitc-1-n32r16v
upload_protocol = espota
upload_port = 192.168.1.82
extra_scripts =
    pre:scripts/ota_auth.py
    post:scripts/ota_quiet.py

; Unit tests that run on the laptop, no board needed: `pio test -e native`
; (JS tests: `node test/js/run_all.js`). The tests include the pure-logic files from src/ directly.
[env:native]
platform = native
test_framework = unity
build_flags = -Isrc -std=gnu++17 -Wall
