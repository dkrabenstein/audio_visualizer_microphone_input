[platformio]
default_envs = esp32-s3-devkitc-1-n32r16v
data_dir = data
extra_configs = platformio_fs.ini

[env:esp32-s3-devkitc-1-n32r16v]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino

; Target: ESP32-S3-WROOM-2 (N32R16V: 32MB Octal Flash, 16MB Octal PSRAM)
board_build.arduino.memory_type = opi_opi
board_build.flash_mode = opi
board_upload.flash_size = 32MB
board_build.filesystem = littlefs
board_build.partitions = default_8MB.csv  ; Switch to custom 32MB table when ready

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    fastled/FastLED @ ^3.6.0
    bblanchon/ArduinoJson @ ^7.0.0
    https://github.com/ESP32Async/ESPAsyncWebServer.git
    https://github.com/ESP32Async/AsyncTCP.git

build_flags =
    -DBOARD_HAS_PSRAM
    -std=gnu++17
    -mfix-esp32-psram-cache-issue
    ; Route AsyncTCP strictly to Core 0 to protect Core 1 rendering/DSP
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=0
    -D CORE_DEBUG_LEVEL=1
    -D FASTLED_RMT_BUILTIN_DRIVER=1

build_unflags =
    -std=gnu++11

[env:upload_web_fs]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.filesystem = littlefs
board_build.partitions = default_8MB.csv
board_upload.flash_size = 32MB

; Execute uploadfs target automatically when this env is triggered
targets = uploadfs