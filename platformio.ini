[platformio]
; Recommended: Store cache centrally in your home .platformio directory
build_cache_dir = ${sysenv.USERPROFILE}/.platformio/build_cache

[env:esp32-s3-devkitc-1-n32r16v]
lib_ldf_mode = chain
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = opi_opi
board_build.flash_mode = dout
board_build.filesystem = littlefs
board_upload.flash_size = 32MB

monitor_speed = 115200

lib_deps =
    fastled/FastLED @ 3.10.3
    bblanchon/ArduinoJson @ 7.0.0
    mathieucarbou/ESPAsyncWebServer @ 3.1.5
    mathieucarbou/AsyncTCP @ 3.2.4

build_flags =
    -DBOARD_HAS_PSRAM
    ; FastLED's RMT interrupt calls flash-resident IDF code; without this, a flash
    ; write (Wi-Fi/NVS) during show() panics with 'Cache disabled'. Makes flash
    ; operations wait until show() finishes.
    -DFASTLED_ESP32_FLASH_LOCK=1

; Wireless upload: `pio run -e ota -t upload`. The board must be on Wi-Fi and already running
; firmware that contains the OTA code (flash that once over USB with the default env).
; NOTE: upload_port is a hardcoded IP because visualizer.local does not resolve from Windows.
; The IP is handed out by DHCP, so it may go stale. If wireless upload fails with "Host ... Not
; Found" or a timeout, read the board's current IP from the serial monitor ("ESP32 IP: ...")
; and update upload_port below (or reserve the IP for the board in your router).
[env:ota]
extends = env:esp32-s3-devkitc-1-n32r16v
upload_protocol = espota
upload_port = 192.168.1.82
extra_scripts = pre:scripts/ota_auth.py
